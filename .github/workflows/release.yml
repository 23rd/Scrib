name: Versioned APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (empty uses the newest version tag)'
        required: false
        type: string

permissions:
  contents: read

env:
  ALL_ABIS: arm64-v8a,armeabi-v7a,x86_64,x86

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Resolve the exact version tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          stable_tag='^v[0-9]+\.[0-9]+(\.[0-9]+)?$'
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(git tag --list 'v*' --sort=-version:refname | grep -E "$stable_tag" | sed -n '1p')"
          fi
          [[ "$tag" =~ $stable_tag ]]
          commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$commit" == "$(git rev-parse "$GITHUB_SHA^{commit}")" ]]
          fi
          version="$(git show "$commit:app/build.gradle" | sed -n "s/^ *versionName '\([^']*\)'$/\1/p")"
          [[ "$version" == "${tag#v}" ]]
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: scrib
            name: Scrib
            flags: ''
          - id: max
            name: Scrib-Max
            flags: '-PwithSherpa'
          - id: remote
            name: Scrib-Remote
            flags: '-PwithRemote'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the sherpa-onnx runtime
        if: matrix.id == 'max'
        run: scripts/download-sherpa-onnx.sh

      # One build of the native code, five apks out of it: the four architectures and the
      # universal one, so a phone on a metered connection downloads its own .so files rather than
      # the other three alongside them. F-Droid keeps building the arm64-only default.
      - name: Build
        run: ./gradlew :app:assembleRelease -PabiSplits -Pabis=$ALL_ABIS ${{ matrix.flags }}

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          NAME: ${{ matrix.name }}
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          mkdir -p dist
          for apk in app/build/outputs/apk/release/app-*-release-unsigned.apk; do
            abi="$(basename "$apk" .apk)"
            abi="${abi#app-}"
            abi="${abi%-release-unsigned}"
            if [ "$abi" = universal ]; then
              out="dist/$NAME.apk"
            else
              out="dist/$NAME-$abi.apk"
            fi
            "$tools/zipalign" -f -P 16 4 "$apk" "$out.aligned"
            "$tools/apksigner" sign --ks release.jks --ks-key-alias scrib \
              --ks-pass env:KEYSTORE_PASS --out "$out" "$out.aligned"
            "$tools/apksigner" verify "$out"
            rm "$out.aligned"
          done
          rm release.jks
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.id }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scrib-release-publication
      queue: max
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: apks

      - name: Write the release notes
        run: |
          VERSION="${TAG#v}"
          cat > notes.md <<EOF
          Version $VERSION · $(date -u +%Y-%m-%d)

          Three separate apps with three separate application ids. They install side by side and none of them replaces another.

          **Scrib** — the lean build, the same one F-Droid ships. Every ggml model family, from Whisper to Parakeet and SenseVoice; nothing leaves the phone.

          **Scrib Max** — the extended build, and by far the largest download of the three. Whisper plus every model family sherpa-onnx adds on top — SenseVoice, Canary, streaming Zipformer, Parakeet, Moonshine — and custom OpenAI-compatible endpoints.

          **Scrib Remote** — no models and no inference code; the same small apk on every phone. It uploads the audio to a server you control and shows what comes back.

          Each app is attached twice over: a universal apk carrying all four architectures, and one apk per architecture — **arm64-v8a** (nearly every phone since 2016), **armeabi-v7a** (older 32-bit phones), **x86_64** and **x86** (emulators, Waydroid, Chromebooks). They all carry the same version code, so moving between them in either direction is a plain install, with no uninstall first.

          All of them are signed with our own key, so none of them can update an F-Droid install.
          EOF

      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-versioned-release.sh "$TAG" "$RELEASE_COMMIT" apks notes.md
