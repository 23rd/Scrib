apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// F-Droid builds the arm64 APK every phone wants; the release workflow passes -Pabis to fold
// the remaining architectures into the single universal APK it attaches to a GitHub release.
def abis = (findProperty('abis') ?: 'arm64-v8a').toString().split(',').toList()

def max = project.hasProperty('withSherpa')
def remote = project.hasProperty('withRemote')
if (max && remote) {
    throw new GradleException('withSherpa and withRemote are two different apps, not one. Pick one.')
}
def local = !remote
def suffix = max ? '.max' : remote ? '.remote' : ''
def appName = max ? 'Scrib Max' : remote ? 'Scrib Remote' : 'Scrib'
def launcher = max ? 'ic_launcher_max' : remote ? 'ic_launcher_remote' : 'ic_launcher'
def launcherRound = max ? 'ic_launcher_round_max' : remote ? 'ic_launcher_round_remote' : 'ic_launcher_round'

android {
    namespace 'org.scrib.transcriber'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "org.scrib.transcriber${suffix}"
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '0.20'

        resValue 'string', 'app_name', appName

        manifestPlaceholders.launcherIcon = "@mipmap/${launcher}"
        manifestPlaceholders.launcherRoundIcon = "@mipmap/${launcherRound}"

        // Remote has no native code of its own, so there is nothing for an abi filter to select
        // and nothing for a split to divide up.
        if (local) {
            ndk {
                abiFilters.addAll(abis)
            }
            externalNativeBuild {
                cmake {
                    cppFlags '-O3'
                    cFlags '-O3'
                    arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                }
            }
        }
    }

    buildFeatures {
        aidl true
        compose true
        buildConfig true
    }

    if (local) {
        externalNativeBuild {
            cmake {
                path 'src/main/jni/whisper/CMakeLists.txt'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            resValue 'string', 'app_name', "${appName} Debug"
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    // ggml builds a cpu backend for every instruction set it knows; only the two jni.c asks for
    // are worth a megabyte of apk each. The rest need instructions no phone sells with (SME), or
    // measured slower than the plain build on real hardware -- the SVE kernels are written for
    // server cores and run at about half the speed on a phone.
    packaging {
        jniLibs {
            excludes += ['**/libggml-cpu-android_armv8.2_1.so',
                         '**/libggml-cpu-android_armv8.6*.so',
                         '**/libggml-cpu-android_armv9*.so']
        }
    }

    // srcDirs of main rather than source sets of their own: one module, one compilation, so an
    // internal declaration in main stays visible to the code that plugs into it.
    sourceSets {
        main {
            kotlin.srcDirs += 'src/main/kotlin'
            if (local) {
                // whisper.cpp, its JNI wrapper and the wav the self test runs on.
                kotlin.srcDirs += 'src/local/kotlin'
                assets.srcDirs += 'src/local/assets'
            }
            if (max || remote) {
                // The remote endpoints: OpenAI-compatible servers and Cloudflare Workers AI.
                kotlin.srcDirs += 'src/endpoint/kotlin'
                res.srcDirs += 'src/endpoint/res'
            }
            if (max) {
                kotlin.srcDirs += 'src/sherpa/kotlin'
                res.srcDirs += 'src/sherpa/res'
            }
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    if (max) {
        if (!file('libs/sherpa-onnx.aar').exists()) {
            throw new GradleException("Missing app/libs/sherpa-onnx.aar — run scripts/download-sherpa-onnx.sh first")
        }
        implementation fileTree(dir: 'libs', include: ['*.aar'])
    }
}
